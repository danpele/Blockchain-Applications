<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Applications - Course Website</title>
    <meta name="description" content="Blockchain Applications - Master's programme Blockchain for Business, Bucharest University of Economic Studies">
    <link rel="icon" href="logos/ida_square.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css?v=20261031b">
    <link rel="stylesheet" href="assets/ba.css?v=20261031b">

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="assets/course-data.js?v=20261031b"></script>
    <script src="assets/site.js?v=20261031b"></script>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="https://www.ase.ro" target="_blank" rel="noopener"><img class="header-logo" src="logos/ase_logo.png" alt="ASE"></a>
            <div class="header-title">
                <h1 data-t="courseTitle">Blockchain Applications</h1>
                <p data-t="subtitle"></p>
            </div>
            <a href="https://www.theida.net/" target="_blank" rel="noopener"><img class="header-logo" src="logos/ida_logo.png" alt="IDA"></a>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="#home" data-t="nav.home">Home</a></li>
            <li><a href="#chapters" data-t="nav.chapters">Lectures</a></li>
            <li><a href="#project" data-t="nav.project">Seminars &amp; Exam</a></li>
            <li><a href="#resources" data-t="nav.resources">Resources</a></li>
            <li><a href="#contact" data-t="nav.contact">Contact</a></li>
        </ul>
    </nav>

    <section class="hero" aria-label="Course at a glance">
        <div class="hero-inner">
            <p class="hero-tag" data-t="heroTag"></p>
            <div class="hero-cta">
                <a class="btn btn-primary btn-lg" href="#chapters" data-t="heroCta1"></a>
                <a class="btn btn-ghost btn-lg" href="#project" data-t="heroCta2"></a>
            </div>
        </div>
    </section>

    <main>
        <section id="home">
            <h2 data-t="overview"></h2>
            <div class="course-info" id="overview-cards"></div>
            <h3 class="sub" data-t="objectives"></h3>
            <ul class="objectives" id="objectives-list"></ul>
        </section>

        <section id="chapters">
            <h2 data-t="chapters"></h2>
            <div class="chapters-grid" id="chapters-grid"></div>
        </section>

        <section id="project">
            <h2 data-t="projectTitle"></h2>
            <p class="section-intro" id="seminar-intro"></p>
            <div class="table-wrap" id="seminar-table"></div>
            <h3 class="sub" data-t="assessmentTitle"></h3>
            <div class="course-info" id="project-cards"></div>
        </section>

        <section id="resources">
            <h2 data-t="resources"></h2>
            <div class="resources-list" id="resources-list"></div>
            <h3 class="sub" data-t="dataSources"></h3>
            <ul class="data-sources" id="data-sources"></ul>
            <h3 class="sub" data-t="bibliography"></h3>
            <ol class="biblio" id="bibliography"></ol>
        </section>

        <section id="contact">
            <h2 data-t="contact"></h2>
            <div class="course-info" id="contact-cards"></div>
        </section>
    </main>

    <footer>
        <div class="footer-logos" id="footer-logos"></div>
        <p id="footer-text"></p>
    </footer>

    <div class="lightbox" id="lightbox" hidden>
        <figure>
            <img id="lightbox-img" alt="">
            <figcaption id="lightbox-cap"></figcaption>
        </figure>
        <button class="lightbox-close" id="lightbox-close" type="button">&times;</button>
    </div>

    <noscript><p style="text-align:center;padding:1rem">This page needs JavaScript.</p></noscript>
</body>
</html>
